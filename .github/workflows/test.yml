name: Test

# The unit tests of scripts/build-pages-site and scripts/generate-changelog:
# standard-library unittest on Python 3.13, with nothing installed. The
# changelog script imports the anthropic SDK only inside its Highlights call,
# which its tests stub, so they need no package and no network; the acceptance
# run in tests/acceptance/ needs both and is not run here. See the handbook's
# ci.md.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
