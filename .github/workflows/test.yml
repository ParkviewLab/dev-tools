name: Test

# The unit tests of scripts/build-pages-site: standard-library unittest on the
# Python the docs-site workflow runs (3.13). See the handbook's ci.md.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
