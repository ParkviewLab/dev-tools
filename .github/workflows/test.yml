name: Test

# The unit tests of the scripts: build-pages-site, generate-changelog,
# assemble-workflows, back-merge-check, git-back-merge and git-dev-release;
# standard-library unittest on Python 3.13, with nothing installed. The
# changelog script imports the anthropic SDK only inside its Highlights call,
# which its tests stub, so they need no package and no network. The tests of
# back-merge-check, git-back-merge and git-dev-release build temporary git
# repositories and run the scripts under the runner's bash 5 (bash 3.2 being
# covered on macOS), with fakes of gh, uv and npm; they need git 2.38 or later
# and jq, which the runner provides. The acceptance run in tests/acceptance/
# needs the network and gh logged in to GitHub, and is not run here. See the
# handbook's ci.md.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
