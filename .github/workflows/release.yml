name: Release

# Tag-driven release for a `VERSION.txt` repo (docs-only — e.g. the handbook
# itself): the VERSION.txt peer of `release.yml` (Python) / `release-node.yml` /
# `release-electron.yml`. On a `v*` tag: the same three-check gate → a GitHub
# Release, nothing else. No artifact (nothing to build or publish) and no
# `changelog` job: a docs repo has no Conventional-Commit signal to categorise,
# so the Release notes are GitHub's generated notes (merged-PR titles since the
# previous tag). The handbook runs this file verbatim as its own
# `.github/workflows/release.yml` (as it does `version-guard.yml`). REUSE-covered
# by the `.github/**` / `templates/.github/**` AGPL buckets (no per-file SPDX
# header). See the handbook's releases.md / ci.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Pre-flight. The release job depends on this, so a bad tag creates nothing.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # full history + all tags: the ancestor and monotonic checks below

      - name: Verify tag matches VERSION.txt
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG != VERSION.txt $VERSION"
            exit 1
          fi

      - name: Verify tag is reachable from origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit $GITHUB_SHA is not on origin/main"
            echo "release tags must come from main — back-merge through, then re-tag from main"
            exit 1
          fi

      - name: Verify version is greater than the previous release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV=$(git tag --list 'v*' | grep -vxF "$TAG" | sort -V | tail -n 1 || true)
          if [ -z "$PREV" ]; then
            echo "no previous v* tag — first release, nothing to compare"
            exit 0
          fi
          if [ "$(printf '%s\n' "$PREV" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "tag $TAG is not greater than the previous release tag $PREV"
            echo "versions only ever increase — bump past $PREV, then re-tag from main"
            exit 1
          fi

  # Create the GitHub Release for the tag (notes generated by GitHub). Idempotent:
  # a re-run, or a Release already made by hand, finds it and exits 0.
  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # scoped here — only this job creates the Release
    steps:
      - uses: actions/checkout@v6   # gh resolves the repo from the origin remote

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            exit 0
          fi
          if ! gh release create "$TAG" --title "$TAG" --verify-tag --generate-notes; then
            # a Release made by hand between the check and the create is fine
            gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG appeared concurrently"; exit 0; }
            exit 1
          fi
