version = 1

SPDX-PackageName = "dev-tools"
SPDX-PackageSupplier = "Gary Frattarola <garyf@parkviewlab.ai>"

# Docs + repo meta → CC-BY-4.0
[[annotations]]
path = ["README.md", "LICENSING.md", "AGENTS.md", "CLAUDE.md", "VERSION.txt", "REUSE.toml", ".gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "CC-BY-4.0"

# Scripts + tests + installer + CI (code/config) → AGPL-3.0-or-later
[[annotations]]
path = ["scripts/**", "tests/**", "install.sh", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The Markdown under tests/ (the acceptance run's README, the evidence reports) → CC-BY-4.0
# Listed last so it overrides the tests/** annotation above for these files.
[[annotations]]
path = ["tests/**/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "CC-BY-4.0"
